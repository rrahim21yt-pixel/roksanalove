<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Roksana ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at center, #250018, #050008 70%);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.stars {
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#ff9bd2 1px, transparent 1px);
  background-size: 55px 55px, 85px 85px;
  animation: moveStars 15s linear infinite;
  opacity: .6;
}

@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(55px); }
}

.card {
  position: relative;
  width: 90%;
  max-width: 600px;
  padding: 35px 20px;
  text-align: center;
  border-radius: 25px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,105,180,.3);
  box-shadow: 0 0 40px rgba(255,0,130,.25);
  backdrop-filter: blur(8px);
  z-index: 2;
}

.heart {
  font-size: 75px;
  animation: beat 1.2s infinite;
  filter: drop-shadow(0 0 18px #ff1493);
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

h1 {
  margin: 10px 0;
  font-size: 34px;
  color: #ff9bd8;
  text-shadow: 0 0 15px #ff1493;
}

.message {
  margin-top: 20px;
  line-height: 2;
  font-size: 20px;
}

.line {
  opacity: 0;
  animation: show 1s forwards;
}

.line:nth-child(1) { animation-delay: 1s; }
.line:nth-child(2) { animation-delay: 2.2s; }
.line:nth-child(3) { animation-delay: 3.4s; }
.line:nth-child(4) { animation-delay: 4.6s; }
.line:nth-child(5) { animation-delay: 5.8s; }

@keyframes show {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

button {
  margin-top: 25px;
  padding: 13px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff1493, #ff69b4);
  color: white;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,20,147,.6);
}

#secret {
  display: none;
  margin-top: 20px;
  color: #ffb6e5;
  font-size: 21px;
  animation: fade 1s;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.floating-heart {
  position: fixed;
  bottom: -30px;
  font-size: 20px;
  animation: float 7s linear infinite;
  z-index: 1;
}

@keyframes float {
  0% {
    transform: translateY(0) scale(.7);
    opacity: 0;
  }
  20% { opacity: 1; }
  100% {
    transform: translateY(-110vh) scale(1.4);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">

  <div class="heart">❤️</div>

  <h1>Hello Roksana</h1>

  <div class="message">

    <div class="line">I'm sorry 💔</div>

    <div class="line">দয়া করে আমাকে ক্ষমা করে দিও 🥺</div>

    <div class="line">আমি সত্যি তোমাকে অনেক ভালোবাসি ❤️</div>

    <div class="line">
      তোমার জন্য কষ্ট করে ৩ ঘন্টাই এই ভিডিও বানালাম
    </div>

    <div class="line">শুধু তোমার জন্য... 💕</div>

  </div>

  <button onclick="showLove()">আমার কথা শুনবে? ❤️</button>

  <div id="secret">
    তুমি আমার কাছে সত্যিই অনেক বিশেষ একজন। ❤️
    <br>
    Please forgive me... 🥺💕
  </div>

</div>

<script>

function showLove() {
  document.getElementById("secret").style.display = "block";
}

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "floating-heart";

  heart.innerHTML = ["❤️","💕","💗","💖","💘"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "vw";

  heart.style.animationDuration =
    (5 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 10000);
}

setInterval(createHeart, 700);

</script>

</body>
  </html>
